<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  {% include header.html %}
  <main id="content" class="{{ page.main_class }}">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/scripts/script.js' | relative_url }}" defer></script>
</body>
</html>
