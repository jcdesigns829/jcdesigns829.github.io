name: Build Jekyll site

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
    - name: Install Jekyll
      run: bundle install
    - name: Build site
      run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production
