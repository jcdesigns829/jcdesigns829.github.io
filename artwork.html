---
layout: default
title: Artwork
---
<header class="page-head">
  <h1>Artwork</h1>
</header>

<ul class="sections">
  {% for s in site.data.sections %}
  {% assign count = site.data.work | where: "section", s.name | size %}
  <li>
    <a class="section-card" href="{{ s.page | relative_url }}">
      <span class="section-cover"><img src="{{ '/images/work/' | append: s.cover | relative_url }}" alt="" loading="lazy"></span>
      <span class="section-name">{{ s.name }}</span>
      <span class="section-count">{{ count }} {% if count == 1 %}piece{% else %}pieces{% endif %}</span>
    </a>
  </li>
  {% endfor %}
</ul>
