{% assign nav = "Home:/,Artwork:/artwork.html,About Me:/about.html,Resume:/resume.html,Contact Me:/contact.html" | split: "," %}
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jack Carlin home">
    <img src="{{ '/images/jc-logo.png' | relative_url }}" alt="" width="48" height="48">
    <span>Jack Carlin</span>
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
    <span class="sr-only">Menu</span><span class="bars" aria-hidden="true"></span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    {% for item in nav %}
      {% assign parts = item | split: ":" %}
      <a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} aria-current="page"{% endif %}>{{ parts[0] }}</a>
    {% endfor %}
  </nav>
  <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
    <span class="icon" aria-hidden="true"></span><span>Dark</span>
  </button>
</header>
